<title id="mega_poison-title">Мега яд</title>
<desc id="mega_poison-desc">Редкий бустер. Постепенно сжигает у игрока 50 процентов от общей массы. Угловатый фиолетовый флакон с зелёной каплей-черепом.</desc>
