<title id="lock-title">Замок</title>
<desc id="lock-desc">Улучшенный бустер «Замок». Закрывает рот игроку, после чего тот не может ничего поглощать. Латунный навесной замок с толстой стальной дужкой и замочной скважиной.</desc>
