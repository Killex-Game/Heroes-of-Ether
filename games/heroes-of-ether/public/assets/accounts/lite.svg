<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="lite-title lite-desc">
  <title id="lite-title">Lite — Герои Эфира</title>
  <desc id="lite-desc">Голубой объёмный щит с золотым билетом подписки и мягкой сиреневой звездой.</desc>
  <defs>
    <radialGradient id="b" cx=".23" cy=".16" r=".93" gradientTransform="translate(0 -.02) scale(1 1.05)">
      <stop stop-color="#D2FFFF"/>
      <stop offset=".28" stop-color="#8CF4FF"/>
      <stop offset=".63" stop-color="#39D6FF"/>
      <stop offset=".86" stop-color="#36A7ED"/>
      <stop offset="1" stop-color="#4785DC"/>
    </radialGradient>
    <linearGradient id="shield-depth" x1=".12" y1="0" x2=".75" y2="1">
      <stop stop-color="#67DFFF"/>
      <stop offset=".5" stop-color="#4EB7EF"/>
      <stop offset="1" stop-color="#457ED4"/>
    </linearGradient>
    <radialGradient id="shield-face" cx=".25" cy=".19" r=".88" gradientTransform="translate(0 -.03) scale(1 1.08)">
      <stop stop-color="#D2FFFF"/>
      <stop offset=".2" stop-color="#72F1FF"/>
      <stop offset=".48" stop-color="#25D7F8"/>
      <stop offset=".76" stop-color="#169BEC"/>
      <stop offset="1" stop-color="#2678E1"/>
    </radialGradient>
    <linearGradient id="shield-bottom" x1=".2" y1="0" x2=".72" y2="1">
      <stop stop-color="#0B83E4" stop-opacity="0"/>
      <stop offset=".66" stop-color="#175AD4" stop-opacity=".06"/>
      <stop offset="1" stop-color="#164DD2" stop-opacity=".54"/>
    </linearGradient>
    <radialGradient id="blue-bounce" cx=".5" cy=".5" r=".5">
      <stop stop-color="#78F9FF" stop-opacity=".88"/>
      <stop offset=".6" stop-color="#67EDFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5CE5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g" cx=".26" cy=".12" r=".94">
      <stop stop-color="#FFFBA5"/>
      <stop offset=".26" stop-color="#FFF16D"/>
      <stop offset=".56" stop-color="#FFD72F"/>
      <stop offset=".81" stop-color="#FFB819"/>
      <stop offset="1" stop-color="#F39712"/>
    </radialGradient>
    <linearGradient id="ticket-depth" x1=".08" y1="0" x2=".74" y2="1">
      <stop stop-color="#F7BD23"/>
      <stop offset=".42" stop-color="#FFBB16"/>
      <stop offset="1" stop-color="#E89415"/>
    </linearGradient>
    <radialGradient id="ticket-face" cx=".25" cy=".12" r=".96">
      <stop stop-color="#FFF4A5"/>
      <stop offset=".4" stop-color="#FFE361"/>
      <stop offset=".75" stop-color="#FFD033"/>
      <stop offset="1" stop-color="#F9AE16"/>
    </radialGradient>
    <linearGradient id="ticket-top-light" x1=".08" y1="0" x2=".9" y2="1">
      <stop stop-color="#FFFFEC"/>
      <stop offset=".48" stop-color="#FFF8B6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF486" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ticket-bounce" cx=".5" cy=".5" r=".5">
      <stop stop-color="#FFF37D" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE14F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star-depth" x1=".2" y1="0" x2=".76" y2="1">
      <stop stop-color="#C286F2"/>
      <stop offset=".6" stop-color="#9A45DD"/>
      <stop offset="1" stop-color="#7838C6"/>
    </linearGradient>
    <radialGradient id="star-face" cx=".3" cy=".27" r=".78">
      <stop stop-color="#ECAEFD"/>
      <stop offset=".32" stop-color="#D88BFB"/>
      <stop offset=".65" stop-color="#B75BE8"/>
      <stop offset=".89" stop-color="#9C45D3"/>
      <stop offset="1" stop-color="#A153DA"/>
    </radialGradient>
    <radialGradient id="star-bounce" cx=".5" cy=".5" r=".5">
      <stop stop-color="#EAA9FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#D986FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white-gloss" x1=".2" y1="0" x2=".7" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAFFFF" stop-opacity=".8"/>
    </linearGradient>
    <filter id="contact-soft" x="-.18" y="-.24" width="1.4" height="1.55" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.45"/>
    </filter>
    <filter id="star-contact" x="-.2" y="-.2" width="1.4" height="1.5" color-interpolation-filters="sRGB">
