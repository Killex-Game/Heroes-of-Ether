# Keep the existing exact public setup/recover-profile 404 rules in the site.
location ^~ /_control/ { return 404; }
location ^~ /api/admin/control/ { return 404; }
location /api/admin/ {
  proxy_pass http://127.0.0.1:3103;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 20s;
  proxy_buffering off;
}
location = /admin.html {
  proxy_pass http://127.0.0.1:3103;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
# Static resources do not consume the independent administration's CPU quota.
location ~ ^/(ui/admin|styles|shared|assets)/ {
  root /srv/heroether-test/play/current/public;
  try_files $uri =404;
}
location /news-media/ {
  proxy_pass http://127.0.0.1:3103;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
