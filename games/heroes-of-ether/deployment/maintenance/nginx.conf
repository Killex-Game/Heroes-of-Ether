# Included inside the existing authenticated HTTPS game server.
location = /maintenance.html {
  alias /var/www/sferorumia-maintenance/maintenance.html;
  add_header Cache-Control no-store always;
}
location = /styles/components/maintenance.css {
  alias /var/www/sferorumia-maintenance/maintenance.css;
  add_header Cache-Control no-store always;
}
location = /ui/layout/maintenance.js {
  alias /var/www/sferorumia-maintenance/maintenance.js;
  add_header Cache-Control no-store always;
}
location = /api/service-status {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_intercept_errors on;
  error_page 502 503 504 = @sferorumia_updating;
}
location @sferorumia_updating {
  default_type application/json;
  add_header Cache-Control no-store always;
  add_header Retry-After 3 always;
  return 200 '{"maintenance":true,"retryAfter":3}';
}
