<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Герои Эфира</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:linear-gradient(145deg,#152e3b,#38596b);color:#284153;font:16px/1.5 system-ui;text-align:center}main{width:min(640px,100%);padding:32px;border:1px solid #dfc492;border-radius:24px;background:linear-gradient(145deg,#fff9eb,#dfeaf1);box-shadow:0 18px 80px #09132166}main[data-mode="maintenance"]{width:min(760px,100%)}h1{font-size:26px;line-height:1.2;margin:16px 0}p{margin:12px 0}.banner{display:block;width:calc(100% + 64px);height:auto;max-height:260px;object-fit:cover;margin:-32px -32px 24px;border-radius:23px 23px 0 0}.symbol{display:grid;place-items:center;margin:auto;width:88px;height:88px;border:2px solid #d6b66f;border-radius:50%;background:#284f68;color:#fff2cf;font-size:48px}button{border:1px solid #b6995f;border-radius:12px;padding:12px 24px;background:#356783;color:white;font:inherit;cursor:pointer}[hidden]{display:none!important}#dates{font-size:14px}@media(max-width:420px),(max-height:460px){main{padding:16px}.banner{width:calc(100% + 32px);margin:-16px -16px 12px}h1{font-size:23px}}
</style></head>
<body><main><img id="banner" class="banner" src="/assets/service/maintenance-v1.png" alt="" width="2048" height="683" hidden><div id="symbol" class="symbol" aria-hidden="true" hidden>⌛</div><h1 id="title">Проверяем доступность игры…</h1><p id="message"></p><p id="dates" hidden></p><button id="retry" type="button" hidden>Проверить снова</button></main>
<script>
(()=>{'use strict';let timer,busy=false,ready=false,last=null;const titles={maintenance:'Техническое обновление',failure:'Что-то пошло не так',unavailable:'Игра временно недоступна'},byId=id=>document.getElementById(id),button=byId('retry'),banner=byId('banner');
banner.onerror=()=>{banner.hidden=true;};
function paint(s){const mode=s.maintenance?(Object.hasOwn(titles,s.mode)?s.mode:'unavailable'):'ready';ready=mode==='ready';document.querySelector('main').dataset.mode=mode;byId('title').textContent=ready?'Игра снова доступна':titles[mode];document.title=byId('title').textContent+' · Герои Эфира';byId('message').textContent=ready?'Можно вернуться в игру.':mode==='maintenance'?'Устанавливаем обновление игры.':'Попробуй вернуться немного позже.';banner.hidden=mode!=='maintenance'||(banner.complete&&!banner.naturalWidth);byId('symbol').hidden=mode==='maintenance'||ready;byId('symbol').textContent=mode==='failure'?'!':'⌛';const date=byId('dates');date.hidden=!s.maintenance||!Number.isFinite(s.endsAt);if(!date.hidden){const end=new Date(s.endsAt),zone={timeZone:'Europe/Moscow'};date.textContent='До '+end.toLocaleDateString('ru-RU',{...zone,day:'numeric',month:'long'})+' '+end.toLocaleTimeString('ru-RU',{...zone,hour:'2-digit',minute:'2-digit'})+' МСК';}button.hidden=mode==='maintenance';button.textContent=ready?'Вернуться в игру':'Проверить снова';}
async function check(){clearTimeout(timer);if(busy||document.hidden)return;busy=true;button.disabled=true;try{const r=await fetch('/api/service-status',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error();const s=await r.json();if(typeof s.maintenance!=='boolean')throw Error();last=s;paint(s);}catch{ready=false;paint(last?.maintenance?last:{maintenance:true,mode:'unavailable'});}finally{busy=false;button.disabled=false;if(!document.hidden&&!ready)timer=setTimeout(check,5000);}}
button.onclick=()=>ready?location.assign('/'):check();document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)check();});addEventListener('online',check);check();})();
</script></body></html>
