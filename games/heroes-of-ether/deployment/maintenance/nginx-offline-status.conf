# Include inside the current HTTPS server, before the general proxy location.
# Only public status and one illustration; private data/config stay closed.
location = /api/service-status {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 2s;
  proxy_intercept_errors on;
  error_page 502 504 =200 /maintenance-status.json;
  add_header Cache-Control no-store always;
}
location = /maintenance-status.json {
  internal;
  root /srv/heroether-test/play;
  default_type application/json;
  try_files /maintenance-public.json @heroether_unavailable_status;
  add_header Cache-Control no-store always;
}
location @heroether_unavailable_status {
  default_type application/json;
  add_header Cache-Control no-store always;
  return 200 '{"maintenance":true,"mode":"unavailable","retryAfter":5}';
}
location = /assets/service/maintenance-v1.png {
  alias /srv/heroether-test/play/current/public/assets/service/maintenance-v1.png;
}
